# Dependency and supply-chain policy. Checked by `make security`.

[graph]
all-features = false
no-default-features = false

[advisories]
# vulnerabilities always emit errors in cargo-deny 0.18+, no field needed
unmaintained = "all"
yanked = "deny"
ignore = [
    # libsqlite3-sys 0.37 is pinned by sqlx 0.9.0, which has no release
    # bundling SQLite 3.54 yet. The exposure needs a local attacker who
    # can write the database file and its -wal sidecar, which the 0600
    # database file mode, the 0600 refusal on open, and the production
    # data directory mode check all block. Remove this entry when sqlx
    # bumps libsqlite3-sys to 0.39 or later.
    { id = "RUSTSEC-2026-0459", reason = "no patched version is reachable through sqlx 0.9.0, the local-write attack path is closed by the store file mode rules" },
    # bincode 1.x is a transitive dependency of cofferak-core, which the
    # plan pins by an exact rev. The advisory reports the crate as
    # unmaintained, not vulnerable. Remove this entry when cofferak
    # moves to bincode 2.
    { id = "RUSTSEC-2025-0141", reason = "pinned by the cofferak-core rev the plan requires, unmaintained but no known vulnerability" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "openssl-sys", reason = "rustls is the only TLS stack allowed, see docs/SPEC.md" },
    { crate = "native-tls", reason = "rustls is the only TLS stack allowed, see docs/SPEC.md" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/arkrwn/cofferak"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
