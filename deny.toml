# Dependency and supply-chain policy. Checked by `make security`.

[graph]
all-features = false
no-default-features = false

[advisories]
# vulnerabilities always emit errors in cargo-deny 0.18+, no field needed
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "openssl-sys", reason = "rustls is the only TLS stack allowed, see docs/SPEC.md" },
    { crate = "native-tls", reason = "rustls is the only TLS stack allowed, see docs/SPEC.md" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/arkrwn/cofferak"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
