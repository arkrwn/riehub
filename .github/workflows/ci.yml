name: CI

# Runs `make check` (fmt + lint + test + rules) on every push and pull request.
# Task T-0001 raises this to `make gate`.
# A pull request merges only when this is green (SDD.md, "CI and toolchain").
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS are the only supported platforms (ADR 0002).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version and its components.
      - name: Install Rust
        run: rustup toolchain install && rustup show

      - name: make check
        run: make check
