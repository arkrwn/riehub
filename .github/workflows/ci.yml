name: CI

# Runs `make gate` (fmt + lint + test + rules + cargo-deny + strict docs)
# on every push and pull request (ADR 0003).
# A pull request merges only when this is green (SDD.md, "CI and toolchain").
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS are the only supported platforms (ADR 0002).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version and its components.
      - name: Install Rust
        run: rustup toolchain install && rustup show

      - name: Install gate tools
        run: make tools

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: make gate
        run: make gate
