[package]
name = "riehub-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "riehub"
path = "src/main.rs"

[dependencies]
riehub-audit = { workspace = true }
riehub-core = { workspace = true }
riehub-crypto = { workspace = true }
riehub-store = { workspace = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
