[package]
name = "riehub-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "riehub"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
cofferak-core.workspace = true
nix = { version = "0.31.3", features = ["resource", "process"] }
riehub-audit = { workspace = true }
riehub-core = { workspace = true }
riehub-crypto = { workspace = true }
riehub-identity = { version = "0.0.1", path = "../riehub-identity" }
riehub-store = { workspace = true }
riehub-vault = { version = "0.0.1", path = "../riehub-vault" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "registry"] }

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
